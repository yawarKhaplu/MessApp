org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# This project lives on D: while the pub cache lives on C:. Kotlin's incremental
# compiler cannot reconcile source files across different roots and aborts with
# "this and base files have different roots" when a plugin (google_sign_in_android)
# is compiled from the cache. Compiling in one shot avoids the failure. Safe to
# remove if the project and the pub cache ever share a drive.
kotlin.incremental=false
